<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zipper live page</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; background: #f3f6ef; color: #17382d; font: 15px/1.5 system-ui, sans-serif; }
    #card { min-height: 188px; padding: 24px; border: 1px solid #ccd8c8; border-radius: 16px; background: white; transition: background .3s; }
    .eyebrow { margin: 0 0 14px; font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #547264; }
    h1 { margin: 0 0 8px; font-size: 26px; line-height: 1.15; letter-spacing: -.05em; }
    #message { margin: 0; color: #466055; }
    #drawing { display: none; max-width: 100%; margin-top: 16px; border-radius: 8px; background: white; }
    #items { padding-left: 20px; }
  </style>
</head>
<body>
  <main id="card">
    <p class="eyebrow">Your little corner of the web</p>
    <h1 id="heading">Hello, possibility.</h1>
    <p id="message">A few lines of Zipper can change this page.</p>
    <ul id="items"></ul>
    <canvas id="drawing" width="400" height="150" aria-label="Drawing made by your program"></canvas>
  </main>
  <script src="preview.js"></script>
</body>
</html>
