<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>OpenZ models · Digital Creatures</title>
    <style>
        * { box-sizing: border-box }
        body { height: 100dvh; margin: 0; display: flex; flex-direction: column; background: #202832; color: #f3f5f7; font: 15px system-ui, sans-serif }

<body>
    <header>
        <a href="index.html">Creatures</a>
        <label>Model <select id="model" title="Choose an OpenZ model to inspect"></select></label>
