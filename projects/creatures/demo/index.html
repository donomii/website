<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Stuff - Population Simulator</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }

        #model-status {
            display: block;
            margin-top: 6px;
        }

        #credits {
            position: absolute;
            right: 10px;
            bottom: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 7px 9px;
            border-radius: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info">
        <strong>World Stuff</strong><br>
        Left/Middle Drag: Grab and slide the ground<br>
        Right Drag: Orbit and tilt the camera<br>
        Scroll: Zoom toward the pointer<br>
        <span id="model-status">Loading animated models…</span>
    </div>
    <a id="credits" href="model-credits.html">Model credits</a>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="main.js?v=20261004-2"></script>
</body>
</html>
