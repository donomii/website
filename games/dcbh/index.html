<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <script src="/projects/games/deck/deck.js"></script>
  <link rel="icon" type="image/png" href="assets/icon.png">
  <title>Dungeon Crawl Bullet Hell (DCBH)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top-nav">
    <nav class="nav-links" aria-label="Site navigation">
      <a href="../../index.html" title="Home">(↑) Home</a>
      <a href="../index.html">Games</a>
    </nav>
    <span class="nav-title">Dungeon Crawl Bullet Hell</span>
  </header>

  <main class="game-shell">
    <div class="canvas-frame">
      <canvas id="game-canvas" width="1024" height="1024" tabindex="0" aria-label="Dungeon Crawl Bullet Hell game canvas"></canvas>
      <div class="overlay-actions">
        <button id="start-btn" class="start-btn" type="button">Start Run</button>
      </div>
    </div>

    <section class="controls-bar" aria-label="Game controls">
      <div class="controls-hints">
        <span>Move: Mouse, Touch, <kbd>WASD</kbd>/<kbd>Arrows</kbd>/<kbd>Numpad</kbd>, or Gamepad</span>
        <span>Walk onto stairs to change floors</span>
        <span>Auto-fire: nearest visible monster</span>
        <span><kbd>P</kbd> Pause</span>
        <span><kbd>R</kbd> Restart</span>
      </div>
      <div class="controls-buttons">
        <button id="pause-btn" class="ctrl-btn" type="button">Pause</button>
        <button id="restart-btn" class="ctrl-btn" type="button">Restart</button>
        <button id="mute-btn" class="ctrl-btn" type="button">Sound: On</button>
      </div>
    </section>
  </main>

  <script src="assets/map-data.js"></script>
  <script src="vendor/crawlmap/crawlmap.js"></script>
  <script src="levels.js"></script>
  <script src="game.js"></script>
</body>
</html>
