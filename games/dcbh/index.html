<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <script src="/projects/games/deck/deck.js"></script>
  <link rel="icon" type="image/png" href="assets/icon.png">
  <title>Dungeon Crawl Bullet Hell (DCBH)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <canvas id="game-canvas" width="1024" height="1024" tabindex="0" aria-label="Dungeon Crawl Bullet Hell"></canvas>
    <footer>
      <div class="scoreline">
        <span title="Current and maximum health">HP <span id="hp"></span></span>
        <span title="Monsters defeated this run">Kills <span id="score"></span></span>
        <span id="floor"></span>
        <span id="run-status" role="status"></span>
      </div>
      <details>
        <summary>Menu</summary>
        <div class="controls">
          <button id="pause-btn" type="button">Pause</button>
          <button id="restart-btn" type="button">Restart</button>
          <button id="mute-btn" type="button">Sound: On</button>
          <button data-deck-games type="button">Games</button>
          <a href="../index.html">Arcade</a>
          <a href="../../index.html">Home</a>
        </div>
        <p>Move with the mouse, touch, WASD, arrows, numpad or gamepad. Walk onto stairs to change floors.</p>
        <p>P pauses, R restarts, M toggles sound. <span id="run-record"></span></p>
      </details>
    </footer>
  </main>

  <script src="assets/map-data.js"></script>
  <script src="vendor/crawlmap/crawlmap.js"></script>
  <script src="levels.js"></script>
  <script src="game.js"></script>
</body>
</html>
